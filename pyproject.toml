[project]
	name = "test-poe-sequence-task"
	version = "0.1.0"
	description = "Add your description here"
	requires-python = ">=3.12"
	dependencies = [
	    "poethepoet>=0.48.0",
	    "pyrefly>=1.3.1",
	    "ruff>=0.16.9",
	]


[tool.poe]

	[tool.poe.executor]
	    type = "uv"

	[tool.poe.tasks.lint]
	    cmd  = "ruff check ."
	    help = "Check code rules using ruff."

	[tool.poe.tasks.type-check]
	    cmd  = "pyrefly check --progress-bar no ."
	    help = "Check static typing using pyrefly."

	[tool.poe.tasks.code-quality-parallel]
	    help = "Run all code quality checks."
	    ignore_fail = "return_non_zero"
	    output_mode = "buffer"
	    verbosity = -2
	    prefix_max = 14
	    prefix = "{name}           "
	    parallel = [
	        "lint",
	        "type-check",
	    ]

	[tool.poe.tasks.code-quality-sequence]
	    help = "Run all code quality checks."
	    ignore_fail = "return_non_zero"
	    sequence = [
	        "lint",
	        "type-check",
	    ]
